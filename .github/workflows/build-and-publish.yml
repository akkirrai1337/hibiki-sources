name: Build and publish changed sources

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write
  packages: read

concurrency:
  group: build-and-publish
  cancel-in-progress: false

jobs:
  build:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Determine changed modules
        id: changed
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.before }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="HEAD~1"
          fi
          modules=$(chmod +x .github/scripts/changed-modules.sh && .github/scripts/changed-modules.sh "$base")
          echo "modules<<HIBIKI_EOF" >> "$GITHUB_OUTPUT"
          echo "$modules" >> "$GITHUB_OUTPUT"
          echo "HIBIKI_EOF" >> "$GITHUB_OUTPUT"
          echo "Changed modules:"
          echo "$modules"

      - name: Decode release keystore
        if: steps.changed.outputs.modules != ''
        shell: bash
        env:
          HIBIKI_SOURCES_KEYSTORE_BASE64: ${{ secrets.HIBIKI_SOURCES_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${HIBIKI_SOURCES_KEYSTORE_BASE64:-}" ]; then
            echo "Missing GitHub secret: HIBIKI_SOURCES_KEYSTORE_BASE64"
            exit 1
          fi
          printf '%s' "$HIBIKI_SOURCES_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sources-release.keystore"

      - name: Build changed modules
        if: steps.changed.outputs.modules != ''
        env:
          HIBIKI_SOURCES_STORE_FILE: ${{ runner.temp }}/sources-release.keystore
          HIBIKI_SOURCES_STORE_PASSWORD: ${{ secrets.HIBIKI_SOURCES_STORE_PASSWORD }}
          HIBIKI_SOURCES_KEY_ALIAS: ${{ secrets.HIBIKI_SOURCES_KEY_ALIAS }}
          HIBIKI_SOURCES_KEY_PASSWORD: ${{ secrets.HIBIKI_SOURCES_KEY_PASSWORD }}
          # settings.gradle.kts resolves org.akkirrai.hibiki:parsers from the hibiki repo's
          # GitHub Packages when there is no local mavenLocal() cache -- needs a token to
          # authenticate, since GitHub Packages rejects anonymous Maven requests outright.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tasks=()
          while IFS= read -r module; do
            [ -z "$module" ] && continue
            tasks+=(":${module}:assembleRelease")
          done <<< "${{ steps.changed.outputs.modules }}"
          if [ "${#tasks[@]}" -eq 0 ]; then
            echo "No source modules changed."
            exit 0
          fi
          ./gradlew "${tasks[@]}"

      - name: Update repository index
        if: steps.changed.outputs.modules != ''
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r module; do
            [ -z "$module" ] && continue
            python3 .github/scripts/update-index.py "$module"
          done <<< "${{ steps.changed.outputs.modules }}"

      - name: Commit updated artifacts and index
        if: steps.changed.outputs.modules != ''
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add artifacts/ repository/index.json
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Publish updated source builds [skip ci]"
            git push
          fi
