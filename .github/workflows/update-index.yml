name: Update repository index

on:
  push:
    branches: [main]
    paths:
      - "extensions/**"
      - "scripts/build_index.py"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate manifests and regenerate index
        run: python scripts/build_index.py

      - name: Commit index if changed
        run: |
          if git diff --quiet -- repository/index.json; then
            echo "index unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add repository/index.json
          git commit -m "chore: regenerate repository/index.json"
          git push
