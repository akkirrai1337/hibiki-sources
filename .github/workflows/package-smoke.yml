name: External source package smoke

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  package-smoke:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - name: Run package and interop smoke
        shell: pwsh
        run: .\package-smoke.ps1
