name: External source package smoke

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-smoke:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - name: Cache Rust dependencies and build output
        uses: Swatinem/rust-cache@v2

      - name: Run Clippy
        shell: pwsh
        run: |
          cargo clippy --manifest-path beakokit-html-sdk/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path aniliberty-wasm/Cargo.toml --target wasm32-wasip1 -- -D warnings
          cargo clippy --manifest-path yummyanime-wasm/Cargo.toml --target wasm32-wasip1 -- -D warnings
          cargo clippy --manifest-path animego-wasm/Cargo.toml --target wasm32-wasip1 -- -D warnings

      - name: Run package and interop smoke
        shell: pwsh
        run: .\package-smoke.ps1
